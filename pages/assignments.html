<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignments · Deadlinely</title>
  <meta name="description" content="Deadlinely – Assignment Tracking SaaS that automatically organises deadlines into a priority list. By SD. Sameer Ahamed (PRN 250200175).">
  <meta name="theme-color" content="#5b5bf0">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script>try{var t=JSON.parse(localStorage.getItem('dl_theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="assignments" data-base="../">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page">

        <div class="toolbar">
          <div class="search"><!-- icon --><input class="input" id="aSearch" type="search" placeholder="Search assignments, subjects, notes…" aria-label="Search assignments"></div>
          <select class="select" id="aStatus" aria-label="Filter by status">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="in-progress">In progress</option>
            <option value="overdue">Overdue</option>
            <option value="done">Done</option>
          </select>
          <select class="select" id="aSubject" aria-label="Filter by subject"><option value="">All subjects</option></select>
          <select class="select" id="aSort" aria-label="Sort">
            <option value="due">Sort: Due date</option>
            <option value="priority">Sort: Smart priority</option>
            <option value="subject">Sort: Subject</option>
            <option value="recent">Sort: Recently added</option>
          </select>
          <button class="btn btn-primary" id="aAdd">+ Add assignment</button>
        </div>
        <p class="muted" id="aSummary" style="margin-bottom:12px;font-size:13.5px"></p>
        <div class="card list-card" id="aList"><div class="loading">Loading…</div></div>
      </main>
      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/priority.js"></script>
  <script src="../js/assignments.js"></script>
  <script src="../js/exams.js"></script>
  <script src="../js/calendar.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
