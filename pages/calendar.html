<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar · Deadlinely</title>
  <meta name="description" content="Deadlinely – Assignment Tracking SaaS that automatically organises deadlines into a priority list. By SD. Sameer Ahamed (PRN 250200175).">
  <meta name="theme-color" content="#5b5bf0">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script>try{var t=JSON.parse(localStorage.getItem('dl_theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="calendar" data-base="../">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page">

        <div class="cal-layout">
          <div class="card">
            <div class="cal-head">
              <h3 id="calTitle"></h3>
              <div class="cal-nav">
                <button class="btn btn-ghost btn-sm" id="calToday">Today</button>
                <button class="btn btn-ghost btn-icon btn-sm" id="calPrev" aria-label="Previous month">‹</button>
                <button class="btn btn-ghost btn-icon btn-sm" id="calNext" aria-label="Next month">›</button>
              </div>
            </div>
            <div class="cal-dow" id="calDow"></div>
            <div class="cal-grid" id="calGrid"></div>
            <div class="cal-legend">
              <span><i style="background:var(--critical)"></i>Critical</span>
              <span><i style="background:var(--high)"></i>High</span>
              <span><i style="background:var(--medium)"></i>Medium</span>
              <span><i style="background:var(--low)"></i>Low</span>
              <span><i style="background:#7a3fd1"></i>Exam</span>
            </div>
          </div>
          <div class="card" id="calDetail"></div>
        </div>
      </main>
      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/priority.js"></script>
  <script src="../js/assignments.js"></script>
  <script src="../js/exams.js"></script>
  <script src="../js/calendar.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
